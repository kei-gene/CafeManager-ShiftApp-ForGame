<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CafeManager 作業表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="board">
  <div class="brand">
    <span class="cup" aria-hidden="true">☕</span>
    <div><h1>Café Shift Board</h1><p>今日の作業表・USD</p></div>
  </div>
  <nav class="tabs" role="tablist" aria-label="画面"><button class="tab" data-tab="home" role="tab">ホーム</button><button class="tab" data-tab="staff" role="tab">従業員</button></nav>
  <button id="reset" class="ghost">初期化</button>
</header>

<main>
<div id="tab-home" class="tabpage" role="tabpanel">
  <section class="stats" id="stats" aria-label="集計"></section>

  <section class="panel">
    <div class="bar">
      <h2>今日のシフト</h2>
      <span class="sp"></span>
      <label>並び順 <select class="sortsel"></select></label><button class="sortdir"></button>
      <label>営業 <select id="open"></select> 〜 <select id="close"></select></label>
      <button id="fill">希望どおりに入れる</button>
      <button id="auto">優先順位で仕事を自動割り当て</button>
      <button id="clear">全部空にする</button>
    </div>
    <div class="palette" id="palette"></div>
    <div class="wrap" id="grid"></div>
    <div class="legend" id="legend"></div>
  </section>

</div>
<div id="tab-staff" class="tabpage" role="tabpanel" hidden>
  <div class="two">
    <section class="panel">
      <div class="bar"><h2>スタッフ</h2><span class="sp"></span><label>並び順 <select class="sortsel"></select></label><button class="sortdir"></button></div>
      <div id="emps"></div>
      <div class="btns"><button class="pri add" id="addEmp">＋ スタッフを追加</button><button class="add" id="openBulk">一括登録</button></div>
    </section>
    <section class="panel">
      <h2>役割と、その中の仕事</h2>
      <div id="roles"></div>
      <button class="add" id="addRole">＋ 役割を追加</button>
    </section>
  </div>
</div>
</main>
<dialog id="bulk">
  <div class="dlg">
    <h2>スタッフを一括登録</h2>
    <p class="hint">1行に1人、「名前, 役割, 時給(USD), 時間帯」の順に書きます。時間帯は「10:00-12:00; 15:00-21:00」のように「;」で区切ると、いくつでも書けます。Excel やスプレッドシートからのコピー（タブ区切り）もそのまま貼れます。同じ名前のスタッフは上書きします。</p>
    <textarea id="bulkText" rows="8" spellcheck="false" placeholder="Emma,バリスタ,12,8:00-12:00; 13:00-16:00"></textarea>
    <label class="chk"><input type="checkbox" id="bulkRoles" checked> 登録されていない役割を自動で追加する</label>
    <p id="bulkMsg" class="bmsg" role="alert"></p>
    <div class="bar"><button type="button" id="bulkSample">入力例を入れる</button><span class="sp"></span><button type="button" id="bulkClose">閉じる</button><button type="button" class="pri" id="bulkGo">取り込む</button></div>
  </div>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
